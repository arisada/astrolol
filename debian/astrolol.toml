# astrolol start-up configuration, read when the service starts:
#   sudo systemctl restart astrolol
# Environment variables (ASTROLOL_<SETTING>) win over this file. What you change in the web UI
# is saved in data_dir, not here. All settings: the "Configuration" section of the README.

# Settings, profiles, users and logs.
data_dir = "/var/lib/astrolol"

# Raw camera files. Default: <data_dir>/images. The service user must be able to write there.
#images_dir = "/mnt/usb/astrolol"

# The INDI server; a setting given here is greyed out in Options.
#indi_server_kind = "indi"        # or "indigo"
#indi_manage_server = true        # false: use a server you start yourself
#indi_host = "localhost"
#indi_port = 7624

# Other web origins allowed to call the API.
#allowed_origins = ["https://astro.example"]

# Folders the web UI may save images, journals and the image library in. Default: data_dir.
# Add a USB drive here (the astrolol user must be able to write to it).
#storage_roots = ["/var/lib/astrolol", "/media/astro"]

# Drivers missing from the driver lists of the installed INDI or INDIGO.
#extra_drivers = ["indi_my_driver"]

# Programs astrolol runs.
#indigo_server_path = "indigo_server"
#astap_program = "astap_cli"
#astap_database = "/opt/astap"
