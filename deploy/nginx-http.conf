# astrolol — nginx reverse proxy, plain HTTP.
#
# ── WHAT TO CHANGE ──────────────────────────────────────────────────────────
# 1. root          Path to the UI build (`cd ui && npm run build` -> ui/dist).
#                  The nginx user (www-data on Debian/Raspberry Pi OS) must be able
#                  to read it, including every parent directory
#                  (`sudo chmod o+x /opt /opt/astrolol`, or similar). If it
#                  cannot, nginx fails with 403 instead of falling back.
# 2. server_name   Host name clients use, or `_` to answer for any name.
# 3. proxy_pass    Only if astrolol does not listen on 127.0.0.1:8000.
#
# ── INSTALL ─────────────────────────────────────────────────────────────────
#   sudo apt install nginx
#   sudo cp deploy/nginx-http.conf /etc/nginx/sites-available/astrolol
#   sudo ln -s /etc/nginx/sites-available/astrolol /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default     # it also listens on port 80
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── HOW IT IS LAID OUT ──────────────────────────────────────────────────────
# astrolol itself serves everything at "/" (API, WebSocket and the UI), so
# the default is to proxy every request to it. nginx only takes over the UI
# files that exist in the build directory (/assets/..., favicon, manifest,
# sw.js, index.html), which it serves faster and with long cache headers.
# Anything else (API calls, /ws, and UI pages such as /mount that the browser
# routes) goes to astrolol, which answers with the UI shell where needed.
# No list of API paths to maintain here.

# Upgrade the connection only when the client asks for a WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/astrolol/ui/dist;
    index index.html;

    # FITS/image uploads and large requests.
    client_max_body_size 100m;

    # UI files from the build; anything that is not a file goes to astrolol.
    location / {
        try_files $uri @astrolol;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @astrolol;
    }

    # Everything else: API, WebSocket, UI pages.
    location @astrolol {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Live event stream and long exposures: don't cut idle connections.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering    off;
    }
}
