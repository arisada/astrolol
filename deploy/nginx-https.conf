# astrolol — nginx reverse proxy, HTTP + HTTPS with a self-signed certificate.
# `sudo deploy/install-nginx-https.sh` does everything below for you (certificate
# for this machine's host name, UI path, install, reload); read on for the manual way.
# HTTP requests are redirected to HTTPS.
#
# ── WHAT TO CHANGE ──────────────────────────────────────────────────────────
# 1. root                 Path to the UI build (`cd ui && npm run build` -> ui/dist).
#                         The nginx user (www-data) must be able to read it,
#                         including every parent directory (for a home directory:
#                         `sudo chmod o+x /home/astrolol`, which lets nginx pass
#                         through without listing it).
# 2. server_name          Host name clients use (e.g. astrolol.local), or `_`.
# 3. ssl_certificate(_key) Where you created the certificate (below).
# 4. proxy_pass           Only if astrolol does not listen on 127.0.0.1:8000.
#
# ── CREATE THE SELF-SIGNED CERTIFICATE (valid 10 years) ─────────────────────
# Put the name/IP clients type into the browser in subjectAltName; browsers
# ignore the CN. Needs OpenSSL 1.1.1+ for -addext.
#
#   sudo mkdir -p /etc/nginx/ssl
#   sudo openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
#     -keyout /etc/nginx/ssl/astrolol.key -out /etc/nginx/ssl/astrolol.crt \
#     -subj "/CN=astrolol.local" \
#     -addext "subjectAltName=DNS:astrolol.local,DNS:astrolol,IP:192.168.1.50"
#   sudo chmod 600 /etc/nginx/ssl/astrolol.key
#
# Browsers will warn about an unknown issuer until you trust astrolol.crt on
# each client (import it as a trusted CA/certificate, or accept the exception
# once). Without HTTPS, browsers also disable some features on non-localhost
# pages (service worker, geolocation), so this is worth doing on a real setup.
#
# ── INSTALL ─────────────────────────────────────────────────────────────────
#   sudo apt install nginx
#   sudo cp deploy/nginx-https.conf /etc/nginx/sites-available/astrolol
#   sudo ln -s /etc/nginx/sites-available/astrolol /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ── HOW IT IS LAID OUT ──────────────────────────────────────────────────────
# astrolol itself serves everything at "/" (API, WebSocket and the UI), so
# the default is to proxy every request to it. nginx only takes over the UI
# files that exist in the build directory (/assets/..., favicon, manifest,
# sw.js, index.html), which it serves faster and with long cache headers.
# Anything else (API calls, /ws, and UI pages such as /mount that the browser
# routes) goes to astrolol, which answers with the UI shell where needed.
# No list of API paths to maintain here.
#
# If the mdns plugin advertises this server, set its scheme/port settings to
# https/443 so clients are sent to the right place.

# Upgrade the connection only when the client asks for a WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx 1.25.1+; on older versions use "listen 443 ssl http2;"
    server_name _;

    ssl_certificate     /etc/nginx/ssl/astrolol.crt;
    ssl_certificate_key /etc/nginx/ssl/astrolol.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    root /home/astrolol/astrolol/ui/dist;
    index index.html;

    # FITS/image uploads and large requests.
    client_max_body_size 100m;

    # UI files from the build; anything that is not a file goes to astrolol.
    location / {
        try_files $uri @astrolol;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @astrolol;
    }

    # Everything else: API, WebSocket, UI pages.
    location @astrolol {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Live event stream and long exposures: don't cut idle connections.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering    off;
    }
}
