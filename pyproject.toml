[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrolol"
version = "0.1.0"
description = "Headless, modular, open-source astronomy platform"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.10",           # default_factory that sees the other fields (Settings)
    "pydantic-settings>=2.2",   # TOML configuration file
    "pluggy>=1.4",
    "structlog>=24.0",
    "astropy>=6.0",
    "numpy>=1.26",
    "Pillow>=10.0",
    "photutils>=1.12",
    "scipy>=1.11",
    "astroplan>=0.10",
    "psutil>=5.9",
    "pyserial>=3.5",
    "zeroconf>=0.131",
    "ifaddr>=0.2",
    "dbus-next>=0.2.3",
    "httpx>=0.27",
]

[project.scripts]
astrolol = "astrolol.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.9",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["astrolol"]
# Plugin UI sources and guide pages (both built into the web UI) and tests are not part of the
# Python package.
exclude = ["astrolol/plugins/*/ui", "astrolol/plugins/*/docs", "astrolol/plugins/*/tests"]

# Adds the built web UI (ui/dist) as astrolol/_ui, see hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.ruff]
target-version = "py311"
line-length = 100
# Third-party code, kept as upstream wrote it.
extend-exclude = ["astrolol/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "astrolol._vendor.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
markers = [
    "slow: real-time tests that take minutes (guiding against the INDI simulators); skipped by default, run with `-m slow`",
]
# Deselect slow tests unless -m is given on the command line (a later -m overrides this one).
addopts = "-m 'not slow'"

[tool.coverage.report]
omit = ["tests/*"]
